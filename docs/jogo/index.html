escription"></p><div class="dialog-actions"><button id="keepCharacter" type="button" data-text="keepCharacter"></button> <button id="changeCharacter" type="button" data-text="changeCharacter"></button><form method="dialog"><button data-text="back"></button></form></div></dialog><dialog id="chapterDialog" aria-labelledby="chapterDialogTitle"><h2 id="chapterDialogTitle" data-text="chooseChapter"></h2><div id="chapterSeries"></div><div id="chapterCards"></div><div class="dialog-actions"><form method="dialog"><button data-text="close">Fechar</button></form></div></dialog><dialog id="pauseDialog" aria-labelledby="pauseTitle"><h2 id="pauseTitle" data-text="paused">Jogo pausado</h2><button id="resumeGame" data-text="resume" type="button" autofocus>▶ Continuar</button></dialog>
